name: CI

# Every push to main is checked. There are no pull requests in this repo,
# so a failing run means main itself is broken and should be fixed next.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, build, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The runner's global yarn hands off to the release pinned in .yarn/releases.
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Build
        run: yarn build

      - name: Type-check (source and tests)
        run: yarn typecheck

      - name: Test
        run: yarn test

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      # No AWS access in CI: the backend and the data sources are not used.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Same images docker-compose.yml runs; the targets share the build cache.
      - name: Build the api, MCP server and web images
        run: |
          for target in api mcp-server web; do
            docker build --target "$target" --tag "health-mcp-$target" .
          done
