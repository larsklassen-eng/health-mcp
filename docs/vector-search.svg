<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .col { font-size: 16px; font-weight: 700; fill: #a21caf; }
      .h { font-size: 14.5px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 12.5px; fill: #334155; }
      .s { font-size: 11.5px; fill: #475569; }
      .lbl { font-size: 11.5px; fill: #0f172a; font-weight: 600; }
      .tag { font-size: 11px; fill: #a21caf; font-weight: 700; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
      .model { fill: #fdf4ff; stroke: #c026d3; stroke-width: 1.4; }
      .store { fill: #f1f5f9; stroke: #475569; stroke-width: 1.3; }
      .db { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .edge { stroke: #334155; stroke-width: 1.5; fill: none; }
      .trigger { stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
      .foot { font-size: 12px; fill: #475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
<text class="title" x="40" y="44">Vector search over patient records</text>
<text class="sub" x="40" y="68">How each patient's free text is indexed in SQLite and searched by the search_patient_records tool. Everything runs on the server; no text goes to an embedding API.</text>
<text class="col" x="40" y="104">Indexing (when records are saved)</text>
<text class="s" x="40" y="122">packages/rag, called by apps/api</text>
<rect class="box" x="40" y="130" width="380" height="112" rx="10"/>
<text class="h" x="56" y="156">Patient records with free text</text>
<text class="t" x="56" y="178">imaging reports · doctor's notes</text>
<text class="t" x="56" y="195">symptoms · chat messages</text>
<text class="t" x="56" y="212">indexed after every save (IndexingService),</text>
<text class="t" x="56" y="229">or all at once: yarn rag:reindex [--full]</text>
<rect class="box" x="40" y="272" width="380" height="78" rx="10"/>
<text class="h" x="56" y="298">Sync (sync.ts)</text>
<text class="t" x="56" y="320">re-chunks each record; skips it when its chunks</text>
<text class="t" x="56" y="337">and date are unchanged, else replaces them</text>
<rect class="box" x="40" y="380" width="380" height="78" rx="10"/>
<text class="h" x="56" y="406">Chunk (chunker.ts)</text>
<text class="t" x="56" y="428">split at paragraphs, then sentences</text>
<text class="t" x="56" y="445">at most 800 characters, 100 characters of overlap</text>
<rect class="model" x="40" y="488" width="380" height="112" rx="10"/>
<text class="h" x="56" y="514">Embed passages (embedder.ts)</text>
<text class="t" x="56" y="536">bge-small-en-v1.5, quantized (q8), with</text>
<text class="t" x="56" y="553">transformers.js on the server: 384 numbers</text>
<text class="t" x="56" y="570">per chunk (CLS pooling, unit length). Writes the</text>
<text class="t" x="56" y="587">chunk to record_chunks, its vector to vec_chunks</text>
<text class="tag" x="406" y="512" text-anchor="end">MODEL</text>
<line class="edge" x1="230.0" y1="242" x2="230.0" y2="270" marker-end="url(#arrow)"/>
<line class="edge" x1="230.0" y1="350" x2="230.0" y2="378" marker-end="url(#arrow)"/>
<line class="edge" x1="230.0" y1="458" x2="230.0" y2="486" marker-end="url(#arrow)"/>
<rect class="db" x="456" y="86" width="368" height="566" rx="14"/>
<text class="col" x="470" y="112">SQLite: data/health.db</text>
<text class="s" x="470" y="130">sqlite-vec loaded on every connection</text>
<rect class="store" x="470" y="136" width="340" height="112" rx="10"/>
<text class="h" x="486" y="162">record_chunks (table)</text>
<text class="t" x="486" y="184">id · patient_id · source_type · source_id</text>
<text class="t" x="486" y="201">source_date · chunk_index · text</text>
<text class="t" x="486" y="218">one row per chunk; deleted with the</text>
<text class="t" x="486" y="235">patient (ON DELETE CASCADE)</text>
<rect class="store" x="470" y="300" width="340" height="112" rx="10"/>
<text class="h" x="486" y="326">vec_chunks (sqlite-vec vec0)</text>
<text class="t" x="486" y="348">rowid = record_chunks.id</text>
<text class="t" x="486" y="365">patient_id: partition key, so a search</text>
<text class="t" x="486" y="382">reads only that patient's vectors</text>
<text class="t" x="486" y="399">embedding float[384], cosine distance</text>
<rect class="store" x="470" y="464" width="340" height="112" rx="10"/>
<text class="h" x="486" y="490">chunks_fts (FTS5)</text>
<text class="t" x="486" y="512">keyword index; text stored once</text>
<text class="t" x="486" y="529">(external content: record_chunks)</text>
<text class="t" x="486" y="546">porter stemmer: headaches → headache</text>
<text class="t" x="486" y="563">kept in sync by triggers</text>
<text class="s" x="470" y="628">Deleting a chunk (or its patient) removes its vector and</text>
<text class="s" x="470" y="643">keywords through the same triggers.</text>
<line class="edge" x1="420" y1="512" x2="468" y2="200" marker-end="url(#arrow)"/>
<line class="edge" x1="420" y1="552" x2="468" y2="366" marker-end="url(#arrow)"/>
<path class="trigger" d="M 780 248 C 830 330, 830 420, 780 462" marker-end="url(#arrow)"/>
<text class="s" x="750" y="440" text-anchor="end">trigger</text>
<text class="col" x="860" y="104">Search (when the model asks)</text>
<text class="s" x="860" y="122">packages/rag search.ts, in apps/mcp-server</text>
<rect class="box" x="860" y="130" width="380" height="94" rx="10"/>
<text class="h" x="876" y="156">search_patient_records (MCP tool)</text>
<text class="t" x="876" y="178">query, sources?, k = 5, chosen by the model</text>
<text class="t" x="876" y="195">patient_id set by the api, never the model</text>
<text class="t" x="876" y="212">results only ever come from that patient</text>
<rect class="model" x="860" y="252" width="380" height="62" rx="10"/>
<text class="h" x="876" y="278">Embed the question</text>
<text class="t" x="876" y="300">same model, with BGE's search instruction</text>
<text class="tag" x="1226" y="276" text-anchor="end">MODEL</text>
<rect class="box" x="860" y="342" width="380" height="78" rx="10"/>
<text class="h" x="876" y="368">Vector: 30 nearest in vec_chunks</text>
<text class="t" x="876" y="390">only this patient's partition</text>
<text class="t" x="876" y="407">kept only if cosine similarity ≥ 0.555</text>
<rect class="box" x="860" y="440" width="380" height="78" rx="10"/>
<text class="h" x="876" y="466">Keyword: 30 best in chunks_fts</text>
<text class="t" x="876" y="488">bm25 ranking, this patient's chunks only</text>
<text class="t" x="876" y="505">any meaningful word (stop words dropped)</text>
<rect class="box" x="860" y="548" width="380" height="78" rx="10"/>
<text class="h" x="876" y="574">Merge: reciprocal rank fusion</text>
<text class="t" x="876" y="596">score = Σ 1 / (60 + rank) over both lists</text>
<text class="t" x="876" y="613">optional filter by source type</text>
<rect class="model" x="860" y="656" width="380" height="112" rx="10"/>
<text class="h" x="876" y="682">Rerank the best 20</text>
<text class="t" x="876" y="704">mxbai-rerank-xsmall-v1 (q8) cross-encoder,</text>
<text class="t" x="876" y="721">on the server; reads question and passage</text>
<text class="t" x="876" y="738">together (up to 512 tokens) and re-orders.</text>
<text class="t" x="876" y="755">The 0.555 floor still decides what is relevant.</text>
<text class="tag" x="1226" y="680" text-anchor="end">MODEL</text>
<rect class="box" x="860" y="798" width="380" height="94" rx="10"/>
<text class="h" x="876" y="824">Top k passages → the model</text>
<text class="t" x="876" y="846">text, source type, date and a link to the record</text>
<text class="t" x="876" y="863">none relevant: "no relevant passages"</text>
<text class="t" x="876" y="880">the chat lists the passages it used</text>
<line class="edge" x1="1050.0" y1="224" x2="1050.0" y2="250" marker-end="url(#arrow)"/>
<line class="edge" x1="1050.0" y1="314" x2="1050.0" y2="340" marker-end="url(#arrow)"/>
<path class="edge" d="M 900 314 L 900 328 L 842 328 L 842 479 L 858 479" marker-end="url(#arrow)"/>
<path class="edge" d="M 1240 381 L 1258 381 L 1258 587 L 1242 587" marker-end="url(#arrow)"/>
<line class="edge" x1="1050.0" y1="518" x2="1050.0" y2="546" marker-end="url(#arrow)"/>
<line class="edge" x1="1050.0" y1="626" x2="1050.0" y2="654" marker-end="url(#arrow)"/>
<line class="edge" x1="1050.0" y1="768" x2="1050.0" y2="796" marker-end="url(#arrow)"/>
<line class="edge" x1="812" y1="356" x2="858" y2="372" marker-end="url(#arrow)"/>
<line class="edge" x1="812" y1="520" x2="858" y2="500" marker-end="url(#arrow)"/>
<text class="foot" x="40" y="690">Measured on the synthetic patients (yarn eval:retrieval, 19 checks):</text>
<text class="foot" x="40" y="708">found in the top 5: 100% with the reranker, 94% without;</text>
<text class="foot" x="40" y="726">mean reciprocal rank 0.86 with it, 0.75 without (see docs/rag.md).</text>
<text class="foot" x="40" y="760">Why both searches: vectors match meaning ("head pain" → headache),</text>
<text class="foot" x="40" y="778">keywords match exact terms the model may not know well (drug names, FLAIR).</text>
<text class="foot" x="40" y="812">Models are downloaded once (yarn rag:model) and baked into the images.</text>
<text class="foot" x="40" y="830">Changing the embedding model needs a new vec_chunks table (384 dimensions)</text>
<text class="foot" x="40" y="848">and yarn rag:reindex --full.</text>
</svg>
